name: Release

# Publishing a GitHub release tagged vX.Y.Z builds the extension at version
# X.Y.Z, attaches the zips to the release and submits them to the Chrome Web
# Store and Firefox Add-ons (AMO).
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Set version from tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${TAG#v}"
          if ! [[ "$version" =~ ^[0-9]+(\.[0-9]+){0,3}$ ]]; then
            echo "::error::Tag '$TAG' must look like v1.2.3 (Chrome manifest versions are 1-4 dot-separated integers)"
            exit 1
          fi
          pnpm pkg set version="$version"

      - run: pnpm compile

      - run: pnpm test

      - run: pnpm zip

      # Also writes the sources zip AMO asks for, since the code is bundled.
      - run: pnpm zip:firefox

      - name: Attach zips to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" .output/*-chrome.zip .output/*-firefox.zip .output/*-sources.zip --clobber

      - name: Submit to Chrome Web Store
        run: pnpm wxt submit --chrome-zip .output/*-chrome.zip
        env:
          CHROME_API_VERSION: v2
          CHROME_EXTENSION_ID: fcekbhgbigdcbkjnahehajmdgnnljijj
          CHROME_PUBLISHER_ID: 10579842-4e58-4df2-811f-6496b3a860cb
          CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ secrets.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL }}
          CHROME_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY }}

      - name: Submit to Firefox Add-ons
        run: pnpm wxt submit --firefox-zip .output/*-firefox.zip --firefox-sources-zip .output/*-sources.zip
        env:
          FIREFOX_EXTENSION_ID: becu-money-manager-amazon@zaquestion.github.io
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
